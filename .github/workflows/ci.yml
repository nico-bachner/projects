name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-slim
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Format
        run: bun fmt --check
      - name: Audit
        run: bun audit
      - name: Install
        run: bun ci
      - name: Check
        run: bun check -b
      - name: Test
        run: bun test
      - name: Build
        run: bun run build

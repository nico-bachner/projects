name: Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  wip:
    if: github.event.pull_request.merged
    runs-on: ubuntu-slim
    steps:
      - name: Delete wip branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          ref="wip/${HEAD_REF#*/}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$ref" --silent 2>/dev/null; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$ref"
          fi

name: Infra

on:
  pull_request:
    paths: ['infra/**', '.github/workflows/infra.yml']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']
  workflow_dispatch:

concurrency:
  group: infra

jobs:
  infra:
    runs-on: ubuntu-slim
    defaults:
      run:
        working-directory: infra
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      GITHUB_TOKEN: ${{ secrets.TOFU_GITHUB_TOKEN }}
      TF_VAR_state_passphrase: ${{ secrets.TF_VAR_state_passphrase }}
      TF_VAR_r2_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      TF_VAR_r2_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_github_admin_token: ${{ secrets.TOFU_GITHUB_TOKEN }}
      TF_VAR_homebrew_tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
      - name: Format
        run: tofu fmt -check
      - name: Init
        run: tofu init
      - name: Plan
        run: tofu plan -out=tfplan
      - name: Apply
        if: github.event_name != 'pull_request'
        run: tofu apply tfplan

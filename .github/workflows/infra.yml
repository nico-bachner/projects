name: Infra

on:
  pull_request:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VAR_state_passphrase: ${{ secrets.TF_VAR_state_passphrase }}
  TF_VAR_r2_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
  TF_VAR_r2_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_github_admin_token: ${{ secrets.TOFU_GITHUB_TOKEN }}
  TF_VAR_homebrew_tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

jobs:
  changes:
    runs-on: ubuntu-slim
    outputs:
      infra: ${{ steps.diff.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if git diff --quiet HEAD^ HEAD -- infra .github/workflows/infra.yml .github/workflows/deploy.yml; then
            echo infra=false >> "$GITHUB_OUTPUT"
          else
            echo infra=true >> "$GITHUB_OUTPUT"
          fi

  plan:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    concurrency:
      group: ${{ needs.changes.outputs.infra == 'false' && github.run_id || 'infra' }}
    defaults:
      run:
        working-directory: infra
    steps:
      - if: needs.changes.outputs.infra != 'false'
        uses: actions/checkout@v7
      - if: needs.changes.outputs.infra != 'false'
        uses: opentofu/setup-opentofu@v2
      - name: Format
        if: needs.changes.outputs.infra != 'false'
        run: tofu fmt -check
      - name: Init
        if: needs.changes.outputs.infra != 'false'
        run: tofu init
      - name: Plan
        if: needs.changes.outputs.infra != 'false'
        run: tofu plan -out=tfplan

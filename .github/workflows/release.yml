name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release

jobs:
  version:
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: orhun/git-cliff-action@v4
        id: bump
        with:
          config: .github/cliff.toml
          args: --include-path "packages/mdpaper/**" --tag-pattern "^mdpaper-v" --bumped-version
      - name: Next version
        id: next
        env:
          BUMPED: ${{ steps.bump.outputs.content }}
        run: |
          bumped=$(printf '%s' "$BUMPED" | tr -d '[:space:]')
          if [ "$(git tag --list "$bumped")" = "$bumped" ]; then
            echo "No releasable mdpaper changes since $bumped."
            exit 0
          fi
          echo "version=${bumped#mdpaper-v}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-26
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun ci
      - name: Build
        run: bun run --cwd packages/mdpaper build
      - name: Smoke test
        run: packages/mdpaper/dist/mdpaper --help
      - name: Package
        run: tar -czf mdpaper-${{ matrix.platform }}.tar.gz -C packages/mdpaper/dist mdpaper
      - uses: actions/upload-artifact@v7
        with:
          name: mdpaper-${{ matrix.platform }}
          path: mdpaper-${{ matrix.platform }}.tar.gz

  publish:
    needs: [version, build]
    runs-on: ubuntu-slim
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: mdpaper-v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: --include-path "packages/mdpaper/**" --tag-pattern "^mdpaper-v" --unreleased --tag ${{ env.RELEASE_TAG }} --strip all
        env:
          OUTPUT: NOTES.md
      - uses: actions/download-artifact@v8
        with:
          pattern: mdpaper-*
          merge-multiple: true
      - name: Checksum
        id: checksum
        run: |
          sha256sum mdpaper-*.tar.gz > SHA256SUMS
          echo "darwin-arm64=$(grep ' mdpaper-darwin-arm64.tar.gz$' SHA256SUMS | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" mdpaper-*.tar.gz SHA256SUMS --target "$GITHUB_SHA" --title "mdpaper $VERSION" --notes-file NOTES.md
      - uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: mdpaper
          homebrew-tap: nico-bachner/homebrew-tap
          tag-name: ${{ env.VERSION }}
          download-url: https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/mdpaper-darwin-arm64.tar.gz
          download-sha256: ${{ steps.checksum.outputs.darwin-arm64 }}
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
